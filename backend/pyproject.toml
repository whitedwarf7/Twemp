[project]
name = "twemp-backend"
version = "0.1.0"
description = "Hierarchical multi-agent incident response backend for Twemp"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# Manual dev utility that only targets a local development server.
"scripts/*" = ["S310"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["agents.*"]
ignore_missing_imports = true
